[build]
  command = "npm run build"
  publish = "dist"

# Proxying through Netlify (rather than calling acad.com.ng directly from the
# browser) means: same-origin requests (simpler CORS), and if HostAfrica's
# domain ever changes you update it here, not in app code or a rebuild.
[[redirects]]
  from = "/acad-api/*"
  to = "https://acad.com.ng/acad-api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routing (react-router) works on refresh/deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
